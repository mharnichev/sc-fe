name: Booking availability and statistics
on:
  push:
    branches: [codex/booking-availability-statistics-20261103, codex/inventory-release-20261104]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: booking-fixes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: barbershop
            repository: ghcr.io/mharnichev/sc-fe/admin-rewards-20261030-pr40
          - app: backoffice
            repository: ghcr.io/mharnichev/sc-fe/admin-rewards-20261030-pr40
    env:
      IMAGE_REPOSITORY: ${{ matrix.repository }}
      APPLICATION: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types and unit regressions
        run: |
          pnpm --filter @apps/${{ matrix.app }} lint
          pnpm --filter @apps/${{ matrix.app }} test
      - name: Production build
        run: pnpm --filter @apps/${{ matrix.app }} build
      - name: Install browser
        run: pnpm --filter @apps/backoffice exec playwright install --with-deps chromium
      - name: Set immutable candidate tag
        run: echo "IMAGE_TAG=${IMAGE_REPOSITORY}:booking-${APPLICATION}-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Build immutable release image
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.source=https://github.com/mharnichev/sc-fe \
            --label org.opencontainers.image.revision=${GITHUB_SHA} \
            --label io.soulcuts.application=${APPLICATION} \
            --file apps/${{ matrix.app }}/Dockerfile --tag "$IMAGE_TAG" .
      - name: Extract exact image artifact for browser verification
        run: |
          set -euo pipefail
          cid="$(docker create --network none "$IMAGE_TAG")"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          mv apps/${{ matrix.app }}/.output apps/${{ matrix.app }}/.output-source-check
          docker cp "$cid:/app/.output" apps/${{ matrix.app }}/.output
      - name: Real browser against exact image artifact with isolated API fixtures
        env:
          BOOKING_TEST_APP: ${{ matrix.app }}
        run: pnpm --filter @apps/backoffice exec playwright test --config playwright.booking-fixes.config.ts
      - name: Verify preview cleanup
        if: always()
        run: |
          node --input-type=module -e '
            import net from "node:net";
            const port = process.env.APP === "barbershop" ? 3313 : 4413;
            const socket = net.connect(port, "127.0.0.1");
            socket.on("connect", () => { socket.destroy(); process.exit(1); });
            socket.on("error", error => process.exit(error.code === "ECONNREFUSED" ? 0 : 1));
          '
        env:
          APP: ${{ matrix.app }}
      - name: Publish verified image and immutable digest
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_TAG"
          docker image inspect "$IMAGE_TAG" > "$RUNNER_TEMP/booking-image.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          image = json.loads((Path(os.environ['RUNNER_TEMP']) / 'booking-image.json').read_text())[0]
          expected = os.environ['IMAGE_REPOSITORY']
          digests = [value for value in image['RepoDigests'] if re.fullmatch(re.escape(expected) + r'@sha256:[a-f0-9]{64}', value)]
          assert len(digests) == 1, 'Expected one immutable image digest'
          assert image['Config']['Labels']['org.opencontainers.image.revision'] == os.environ['GITHUB_SHA']
          assert image['Config']['Labels']['org.opencontainers.image.source'] == 'https://github.com/mharnichev/sc-fe'
          assert image['Config']['Labels']['io.soulcuts.application'] == os.environ['APPLICATION']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Source: `' + os.environ['GITHUB_SHA'] + '`\n\nImage: `' + digests[0] + '`\n\nExact image browser and cleanup checks passed.\n')
          print(digests[0])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-${{ matrix.app }}-browser-evidence
          path: |
            apps/backoffice/test-results/booking-fixes-${{ matrix.app }}
            apps/backoffice/output/booking-statistics
